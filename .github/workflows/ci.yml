name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - name: verify generated artifacts are committed and unmodified
        run: git diff --exit-code

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm -r build

      - name: publint, attw and the pack-manifest snapshot for every publishable package
        run: pnpm verify:packaging
